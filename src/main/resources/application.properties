# App Name
spring.application.name=url-shortener

# MySQL Config for url
url.datasource.jdbc-url=jdbc:mysql://localhost:3306/urlShortner
url.datasource.username=root
url.datasource.password=123456789
url.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL Config for analytics
analytics.datasource.jdbc-url=jdbc:mysql://localhost:3306/urlAnalytics
analytics.datasource.username=root
analytics.datasource.password=123456789
analytics.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Config
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=analytics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# JSON
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.*

# Producer Reliability
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Consumer
spring.kafka.consumer.enable-auto-commit=false  